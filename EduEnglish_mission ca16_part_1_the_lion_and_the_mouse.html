  <main id="app-main" class="max-w-4xl mx-auto px-4 pt-5 space-y-5"></main>

  <script>
    // =====================================================================
    // 🔊 INTERNAL GEMINI 2.5 FLASH TTS + 21-LANGUAGE TRANSLATION ENGINE
    // =====================================================================
    const apiKey = "";

    const VALID_VOICES = new Set(["Aoede", "Charon", "Fenrir", "Kore", "Leda", "Orus", "Puck", "Zephyr"]);
    function getSafeVoice(role) {
      if (VALID_VOICES.has(role)) return role;
      const v = LESSON_DATA.voices || { partner: "Aoede", student: "Zephyr", teacher: "Charon" };
      const r = role === 'partner' ? v.partner : (role === 'teacher' ? v.teacher : v.student);
      return VALID_VOICES.has(r) ? r : "Zephyr";
    }

    const audioCache = new Map();
    const sharedAudioPlayer = new Audio();

    function pcmToWav(base64Pcm, sampleRate = 24000) {
      const bin = atob(base64Pcm);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const buf = new ArrayBuffer(44 + bytes.length);
      const view = new DataView(buf);
      const ws = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      ws(view, 0, 'RIFF'); view.setUint32(4, 36 + bytes.length, true); ws(view, 8, 'WAVE'); ws(view, 12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true); ws(view, 36, 'data');
      view.setUint32(40, bytes.length, true);
      for (let i = 0; i < bytes.length; i++) view.setUint8(44 + i, bytes[i]);
      return URL.createObjectURL(new Blob([view], { type: 'audio/wav' }));
    }

    async function fetchGeminiTTS(text, voiceName = "Zephyr") {
      const clean = (text || "").trim();
      const ck = `${voiceName}:${clean}`;
      if (audioCache.has(ck)) return audioCache.get(ck);
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `Read this aloud naturally: ${clean}` }] }],
          generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } } },
          model: "gemini-2.5-flash-preview-tts"
        })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const wav = pcmToWav(data.candidates[0].content.parts[0].inlineData.data);
      audioCache.set(ck, wav);
      return wav;
    }

    async function speakText(text, btn, role = "student", rate = 1.0) {
      if (!text || !text.trim()) return;
      sharedAudioPlayer.pause();
      const orig = btn ? btn.innerHTML : "";
      if (btn) { btn.innerHTML = "⏳"; btn.disabled = true; }
      try {
        const wav = await fetchGeminiTTS(text, getSafeVoice(role));
        sharedAudioPlayer.src = wav;
        sharedAudioPlayer.playbackRate = rate;
        if (btn) btn.innerHTML = "🔊";
        sharedAudioPlayer.onended = () => { if (btn) { btn.innerHTML = orig; btn.disabled = false; } };
        await sharedAudioPlayer.play();
      } catch (e) { if (btn) { btn.innerHTML = orig; btn.disabled = false; } }
    }

    function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

    let fs = 16;
    function changeFontSize(d) { fs = Math.min(24, Math.max(12, fs + d * 2)); document.documentElement.style.fontSize = fs + 'px'; }

    async function translateTextDirect(txt) {
      if (!txt) return;
      document.getElementById('translate-modal').style.display = 'block';
      document.getElementById('t-modal-original').innerText = `"${txt}"`;
      const resEl = document.getElementById('t-modal-result');
      resEl.innerText = 'Translating...';
      const tl = document.getElementById('targetLanguage').value;
      try {
        const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${tl}&dt=t&q=${encodeURIComponent(txt)}`);
        const d = await r.json();
        resEl.dir = ['ar', 'fa', 'he', 'ur'].includes(tl) ? 'rtl' : 'ltr';
        resEl.innerText = d[0].map(c => c[0]).join('');
      } catch (e) { resEl.innerText = 'Translation unavailable.'; }
    }

    let selTxt = "";
    const tBtn = document.getElementById('highlight-translate-btn');
    document.addEventListener('mouseup', e => {
      if (e.target.closest('#highlight-translate-btn, #translate-modal')) return;
      setTimeout(() => {
        const s = window.getSelection().toString().trim();
        if (s.length > 1) {
          selTxt = s;
          const r = window.getSelection().getRangeAt(0).getBoundingClientRect();
          tBtn.style.left = `${Math.max(10, r.left + window.scrollX)}px`;
          tBtn.style.top = `${r.top + window.scrollY - 40}px`;
          tBtn.style.display = 'flex';
        } else tBtn.style.display = 'none';
      }, 15);
    });
    tBtn.onclick = () => { tBtn.style.display = 'none'; translateTextDirect(selTxt); };

    function initSharedHeader(badgeText) {
      document.getElementById('hdr-part-badge').innerText = badgeText;
      document.getElementById('page-title').innerText = `${LESSON_DATA.meta.level} · ${LESSON_DATA.meta.title}`;
      document.getElementById('hdr-level').innerText = LESSON_DATA.meta.level;
      document.getElementById('hdr-title').innerText = LESSON_DATA.meta.title;
      document.getElementById('hdr-grammar-topic').innerText = `Golden Thread: ${LESSON_DATA.meta.grammarTopic}`;
      if (LESSON_DATA.meta.recycledChunks) {
        document.getElementById('recycled-spine-bar').innerHTML = LESSON_DATA.meta.recycledChunks.map(c =>
          `<button data-s="${esc(c)}" onclick="speakText(this.dataset.s, this, 'student')" class="px-2 py-0.5 rounded bg-white/15 hover:bg-white/25 text-white text-[11px] font-bold">${esc(c)} 🔊</button>`
        ).join('');
      }
    }

    // =====================================================================
    // 📚 LESSON DATA: THE LION AND THE MOUSE (CEFR B1)
    // =====================================================================
    const LESSON_DATA = {
      meta: {
        level: "B1",
        title: "The Lion and the Mouse · Even the Smallest Can Help",
        grammarTopic: "Purpose & Result with 'so that'",
        recycledChunks: [
          "fall asleep",
          "beg for mercy",
          "let someone go",
          "get caught in a net",
          "chew through the rope",
          "keep a promise"
        ]
      },
      voices: { partner: "Aoede", student: "Zephyr", teacher: "Charon" },
      vocab: [
        {
          word: "fall fast asleep",
          trans: "drift peacefully into sleep",
          start: "Under the acacia tree, the lion",
          chunk: "fell fast asleep",
          end: "so that he could rest in the breeze."
        },
        {
          word: "beg for mercy",
          trans: "ask politely for forgiveness and life",
          start: "The trembling mouse",
          chunk: "begged for mercy",
          end: "so that the lion would spare her life."
        },
        {
          word: "let her go",
          trans: "allow someone to run free",
          start: "The amused king",
          chunk: "let her go safely",
          end: "so that she could scamper away."
        },
        {
          word: "get caught in a net",
          trans: "become trapped in heavy cords",
          start: "The proud lion",
          chunk: "got caught in a net",
          end: "so that he roared wildly in fear."
        },
        {
          word: "keep her promise",
          trans: "do exactly what was promised",
          start: "The faithful mouse",
          chunk: "kept her promise",
          end: "so that her new friend was rescued."
        }
      ],
      warmup: {
        mode: "scenario_chat",
        emoji: "🦁🐭",
        sceneText: "A small mouse accidentally wakes the king of beasts, but promises to repay his kindness one day!",
        questions: [
          "Has a younger or smaller friend ever helped you solve a tricky problem?",
          "Why did the lion laugh out loud when the mouse promised to help him?",
          "How does keeping our promises build trust between completely different friends?"
        ],
        thisOrThat: [
          {
            q: "If a tiny mouse begged you for mercy, what would you do first?",
            optA: "🦁 Smile and let her go free",
            optB: "📜 Ask for a written promise first"
          },
          {
            q: "When facing a giant rope net, which skill is more useful?",
            optA: "🦷 Sharp front teeth to chew cords",
            optB: "📢 A mighty roar to call for help"
          }
        ],
        alibiPrompt: "🎭 Two Truths & A Lie: Pick 3 cards below and tell Linda 2 truths + 1 fable lie using 'so that'!",
        vocabFrames: [
          {
            label: "✅ Positive Action (Purpose)",
            before: "The mouse acted bravely and",
            after: "so that the lion could escape."
          },
          {
            label: "🛡️ Generous King (Result)",
            before: "The amused lion kindly decided to",
            after: "so that she lived peacefully."
          },
          {
            label: "❓ Question (Checking Reason)",
            before: "Did the little mouse really",
            after: "so that she could save her friend?"
          }
        ],
        lessonVocab: [
          { word: "fall asleep", pastForm: "fell asleep", trans: "begin sleeping quietly", level: "B1" },
          { word: "wake up", pastForm: "woke up", trans: "stop sleeping suddenly", level: "A2" },
          { word: "beg for mercy", pastForm: "begged for mercy", trans: "ask for kindness and safety", level: "B1" },
          { word: "let her go", pastForm: "let her go", trans: "free someone from your grasp", level: "B1" },
          { word: "get caught in a net", pastForm: "got caught in a net", trans: "become stuck in a trap", level: "B1" },
          { word: "roar in fear", pastForm: "roared in fear", trans: "cry loudly when helpless", level: "B1" },
          { word: "chew through the rope", pastForm: "chewed through the rope", trans: "cut thick cords with teeth", level: "B1" },
          { word: "keep one's promise", pastForm: "kept her promise", trans: "honor your word faithfully", level: "A2" },
          { word: "spare her life", pastForm: "spared her life", trans: "choose not to harm someone", level: "B1" },
          { word: "repay kindness", pastForm: "repaid kindness", trans: "return a generous favor", level: "B1" }
        ],
        pillars: [{ title: "Purpose with 'so that'", desc: "Use 'so that' + subject + could/would to explain why someone did something." }]
      },
      listening: {
        title: "🎧 Voice Note: Teacher Alex's Fable Summary",
        mode: "spot_the_lie",
        transcript: "Hey Linda! I just finished reading that jungle fable. The lion thought he was too big to ever need help from anyone. But when hunters trapped him, a tiny mouse saved him! She chewed through the rope so that the king could escape. It proves that small friends can do big things!",
        questions: [
          "Why did the lion think he would never need the mouse's help?",
          "How did the mouse manage to free the lion from the trap?",
          "What lesson does this fable teach us about small friends?"
        ],
        spotTheLieText: "The lion was trapped in a wooden cage. The mouse called an elephant for help. In the end, the mouse forgot her promise.",
        spotTheLieKey: "1. Trap was a rope net (not a wooden cage), 2. Mouse used her own sharp teeth (not an elephant), 3. Mouse kept her promise faithfully.",
        predictPrompt: "🔮 What would the lion say to his jungle friends after the mouse saved him?"
      },
      drills: [
        {
          mode: "scramble",
          type: "🔀 Unscramble",
          prompt: "let / so / her / that / go / she / escaped / he",
          answer: "He let her go so that she escaped."
        },
        {
          mode: "bug_hunt",
          type: "🐞 Fix the Bug",
          prompt: "❌ \"The mouse chewed the cords so that the lion will run away yesterday.\"",
          answer: "The mouse chewed the cords so that the lion could run away."
        },
        {
          mode: "upgrade",
          type: "✨ Natural Upgrade",
          prompt: "Simple: \"The mouse cut the thick ropes with her teeth.\"",
          answer: "The mouse chewed through the rope so that the lion fell free."
        },
        {
          mode: "scramble",
          type: "🔀 Unscramble",
          prompt: "promise / kept / her / she / so / that / he / trusted / her",
          answer: "She kept her promise so that he trusted her."
        },
        {
          mode: "bug_hunt",
          type: "🐞 Fix the Bug",
          prompt: "❌ \"The lion got caught on a net while walking down the road.\"",
          answer: "The lion got caught in a net while walking down the road."
        },
        {
          mode: "upgrade",
          type: "✨ Natural Upgrade",
          prompt: "Simple: \"The trapped king shouted loudly because he was scared.\"",
          answer: "The trapped lion roared in fear so that someone might hear him."
        },
        {
          mode: "scramble",
          type: "🔀 Unscramble",
          prompt: "tree / under / slept / lion / the / asleep / fell / the",
          answer: "The lion fell asleep under the tree."
        },
        {
          mode: "upgrade",
          type: "✨ Natural Upgrade",
          prompt: "Simple: \"She asked the king very politely not to kill her.\"",
          answer: "She begged for mercy so that the lion would spare her life."
        }
      ]
    };

    let curFrame = 0, curVocab = 0, activeDrills = [...LESSON_DATA.drills];
    const wModes = ["scenario_chat", "this_or_that", "alibi"], lModes = ["voicemail", "spot_the_lie", "predict_ending"];

    function renderPart1() {
      initSharedHeader("PART 1 · INPUT, SCENARIO & SYNTAX DRILLS");
      document.getElementById('app-main').innerHTML = `
        <!-- Section 1: 5 Core Conversational Chunks -->
        <section class="bg-white rounded-3xl border border-slate-200 p-5 space-y-2.5 shadow-sm">
          <div class="flex justify-between items-center">
            <h2 class="font-extrabold text-base text-slate-900">🗣️ 1. 5 Core Conversational Chunks</h2>
            <button onclick="document.querySelectorAll('.v-chunk').forEach(c=>c.classList.toggle('chunk-masked'))" class="text-xs font-bold bg-indigo-50 hover:bg-indigo-100 text-indigo-800 px-3 py-1 rounded-xl transition">🙈 Mask Chunks</button>
          </div>
          <p class="text-xs text-slate-500 font-medium">Click any chunk to reveal it. Tap 🔊 to listen with Gemini TTS or 🌍 to view translation.</p>
          ${LESSON_DATA.vocab.map(v => {
            const full = `${v.start} ${v.chunk} ${v.end}`.replace(/ '/g, "'");
            return `<div class="p-3 rounded-2xl border border-slate-200/80 bg-slate-50/50 flex flex-wrap items-center justify-between gap-2 hover:bg-slate-50 transition">
              <div class="min-w-[140px]"><span class="px-2 py-0.5 rounded-lg bg-indigo-100 text-indigo-800 font-extrabold text-xs">${esc(v.word)}</span> <span class="text-xs text-slate-400">(${esc(v.trans)})</span></div>
              <div class="text-xs sm:text-sm font-semibold flex-1 text-slate-800">${esc(v.start)} <span class="v-chunk font-extrabold text-indigo-700 bg-indigo-100/70 px-2 py-0.5 rounded cursor-pointer" onclick="this.classList.remove('chunk-masked')">${esc(v.chunk)}</span> ${esc(v.end)}</div>
              <div class="flex gap-1">
                <button data-s="${esc(full)}" onclick="speakText(this.dataset.s,this,'student')" class="px-2.5 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg text-xs font-bold shadow-xs">🔊</button>
                <button data-s="${esc(v.word)}" onclick="translateTextDirect(this.dataset.s)" class="px-2.5 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg text-xs font-bold shadow-xs">🌍</button>
              </div>
            </div>`;
          }).join('')}
        </section>

        <!-- Section 2: Real-Life Scenario & Expression Playground -->
        <section class="bg-white rounded-3xl border border-slate-200 p-5 space-y-4 shadow-sm">
          <div class="flex flex-wrap justify-between items-center gap-2">
            <h2 class="font-extrabold text-base text-slate-900">🖼️ 2. Real-Life Scenario & Expression Playground</h2>
            <button onclick="LESSON_DATA.warmup.mode=wModes[(wModes.indexOf(LESSON_DATA.warmup.mode)+1)%3]; renderPart1()" class="px-3 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-xl text-xs font-extrabold transition">🎲 Switch Warm-Up (${LESSON_DATA.warmup.mode})</button>
          </div>
          <div class="bg-amber-50/80 border border-amber-200/80 p-3.5 rounded-2xl flex items-center justify-between gap-2">
            <p class="text-xs sm:text-sm font-bold text-slate-800">${LESSON_DATA.warmup.emoji} ${esc(LESSON_DATA.warmup.sceneText)}</p>
            <div class="flex gap-1 shrink-0">
              <button data-s="${esc(LESSON_DATA.warmup.sceneText)}" onclick="speakText(this.dataset.s,this,'teacher')" class="px-2 py-1 bg-white border border-amber-200 rounded-lg text-xs font-bold">🔊</button>
              <button data-s="${esc(LESSON_DATA.warmup.sceneText)}" onclick="translateTextDirect(this.dataset.s)" class="px-2 py-1 bg-white border border-amber-200 rounded-lg text-xs font-bold">🌍</button>
            </div>
          </div>
          <div id="warmup-game-box" class="space-y-2"></div>

          <!-- Sentence Frame Matrix -->
          <div class="bg-slate-50 border-2 border-indigo-100 p-4 rounded-2xl space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-black uppercase text-indigo-900 tracking-wider">🎯 Step 1: Select a Sentence Frame</span>
              <span class="text-[11px] font-semibold text-slate-500">Golden Thread: 'so that'</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              ${LESSON_DATA.warmup.vocabFrames.map((f, i) => `<button onclick="curFrame=${i}; renderPart1()" class="p-2.5 rounded-xl border text-left transition ${curFrame===i?'bg-indigo-600 text-white border-indigo-600 shadow-sm':'bg-white border-slate-200 hover:bg-indigo-50/50'}">
                <span class="text-[10px] font-extrabold uppercase block ${curFrame===i?'text-indigo-200':'text-indigo-700'}">${esc(f.label)}</span>
                <span class="text-xs font-bold">"${esc(f.before)} [...] ${esc(f.after)}"</span>
              </button>`).join('')}
            </div>

            <div class="bg-indigo-950 text-white p-3.5 rounded-xl flex items-center justify-between gap-2 shadow-inner">
              <div>
                <span class="text-[10px] uppercase font-black tracking-widest text-indigo-300 block">Generated Spoken Sentence:</span>
                <span id="live-frame-sent" class="text-xs sm:text-sm font-extrabold text-amber-300"></span>
              </div>
              <div class="flex gap-1 shrink-0">
                <button onclick="speakText(document.getElementById('live-frame-sent').innerText,this,'student')" class="px-3 py-1 bg-indigo-500 hover:bg-indigo-400 rounded-lg text-xs font-bold transition">🔊 Listen</button>
                <button onclick="translateTextDirect(document.getElementById('live-frame-sent').innerText)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs">🌍</button>
              </div>
            </div>

            <div class="flex items-center justify-between pt-1">
              <span class="text-xs font-black uppercase text-slate-700 tracking-wider">📚 Step 2: Choose a Key Expression</span>
              <span class="text-[11px] font-semibold text-slate-500">Click to insert into the frame</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${LESSON_DATA.warmup.lessonVocab.map((it, i) => `<div onclick="curVocab=${i}; it.used=true; renderPart1()" class="cursor-pointer bg-white border border-slate-200 hover:border-indigo-300 rounded-xl p-2.5 flex justify-between items-center transition ${curVocab===i?'vocab-card-active':''} ${it.used?'vocab-card-used':''}">
                <div>
                  <span class="text-[10px] font-black px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 mr-1.5">${it.level}</span>
                  <strong class="text-xs sm:text-sm text-slate-900">${esc(it.word)}</strong>
                  <p class="text-[11px] text-slate-500 font-medium">${esc(it.trans)}</p>
                </div>
                <div class="flex gap-1 shrink-0" onclick="event.stopPropagation()">
                  <button data-s="${esc(it.word)}" onclick="speakText(this.dataset.s,this,'teacher')" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded text-xs">🔊</button>
                  <button data-s="${esc(it.word)}" onclick="translateTextDirect(this.dataset.s)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded text-xs">🌍</button>
                </div>
              </div>`).join('')}
            </div>
          </div>
        </section>

        <!-- Section 3: Listening Challenge -->
        <section class="bg-white rounded-3xl border border-slate-200 p-5 space-y-3 shadow-sm">
          <div class="flex flex-wrap justify-between items-center gap-2">
            <h2 class="font-extrabold text-base text-slate-900">${esc(LESSON_DATA.listening.title)}</h2>
            <div class="flex gap-1.5">
              <button onclick="speakText(LESSON_DATA.listening.transcript,this,'teacher',1.0)" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition shadow-xs">▶️ Listen (1.0x)</button>
              <button onclick="LESSON_DATA.listening.mode=lModes[(lModes.indexOf(LESSON_DATA.listening.mode)+1)%3]; renderPart1()" class="px-2.5 py-1 bg-blue-100 text-blue-900 rounded-xl text-xs font-extrabold">🎲 Mode: ${LESSON_DATA.listening.mode}</button>
            </div>
          </div>
          <div id="listen-box"></div>
          <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="text-xs font-bold text-slate-600 hover:text-indigo-600 underline">👁️ Show/Hide Audio Transcript</button>
          <p class="hidden p-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs text-slate-700 italic leading-relaxed">${esc(LESSON_DATA.listening.transcript)}</p>
        </section>

        <!-- Section 4: Multi-Mode Syntax Drills -->
        <section class="bg-white rounded-3xl border border-slate-200 p-5 space-y-3 shadow-sm">
          <div class="flex justify-between items-center">
            <h2 class="font-extrabold text-base text-slate-900">⚡ 4. Multi-Mode Syntax Drills</h2>
            <button onclick="activeDrills=[...LESSON_DATA.drills].sort(()=>Math.random()-0.5).slice(0,4); renderPart1()" class="px-3 py-1 bg-rose-100 hover:bg-rose-200 text-rose-900 rounded-xl text-xs font-bold transition">🔀 Deal 4 Random</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${activeDrills.map(d => `<div class="p-4 rounded-2xl border border-slate-200 bg-white flex flex-col justify-between space-y-3 shadow-2xs">
              <div>
                <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-lg bg-rose-50 text-rose-800 border border-rose-200/60">${esc(d.type)}</span>
                <p class="font-mono text-xs sm:text-sm font-bold text-slate-900 mt-2.5 mb-2">${esc(d.prompt)}</p>
                <div class="hidden p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl text-xs font-bold text-emerald-950 mb-1">✅ "${esc(d.answer)}"</div>
              </div>
              <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                <button onclick="this.parentElement.previousElementSibling.lastElementChild.classList.toggle('hidden')" class="text-xs font-extrabold text-indigo-700 hover:underline">👁️ Check</button>
                <div class="flex gap-1">
                  <button data-s="${esc(d.answer)}" onclick="speakText(this.dataset.s,this,'student')" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold">🔊</button>
                  <button data-s="${esc(d.answer)}" onclick="translateTextDirect(this.dataset.s)" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold">🌍</button>
                </div>
              </div>
            </div>`).join('')}
          </div>
        </section>`;

      // Render sentence frame output
      const f = LESSON_DATA.warmup.vocabFrames[curFrame];
      const it = LESSON_DATA.warmup.lessonVocab[curVocab];
      const verbChunk = it.pastForm || it.word;
      document.getElementById('live-frame-sent').innerText = `${f.before} ${verbChunk} ${f.after}`;

      // Render warmup mode container
      const wb = document.getElementById('warmup-game-box');
      if (LESSON_DATA.warmup.mode === 'this_or_that') {
        wb.innerHTML = LESSON_DATA.warmup.thisOrThat.map(t => `
          <div class="p-3 bg-white rounded-xl border border-slate-200 text-xs font-bold space-y-1">
            <span class="text-slate-700 block">${esc(t.q)}</span>
            <div class="flex gap-2">
              <span class="text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">${esc(t.optA)}</span>
              <span class="text-slate-400 self-center">OR</span>
              <span class="text-rose-600 bg-rose-50 px-2.5 py-1 rounded-lg">${esc(t.optB)}</span>
            </div>
          </div>`).join('');
      } else if (LESSON_DATA.warmup.mode === 'alibi') {
        wb.innerHTML = `<div class="p-3 bg-white rounded-xl border-2 border-amber-300 text-xs font-bold text-amber-950">${esc(LESSON_DATA.warmup.alibiPrompt)}</div>`;
      } else {
        wb.innerHTML = LESSON_DATA.warmup.questions.map((q, i) => `
          <div class="p-2.5 bg-white rounded-xl border border-slate-200 flex justify-between items-center text-xs sm:text-sm font-bold text-slate-800">
            <span>${i+1}. ${esc(q)}</span>
            <button data-s="${esc(q)}" onclick="speakText(this.dataset.s,this,'teacher')" class="px-2 py-1 bg-amber-50 hover:bg-amber-100 rounded-lg text-xs font-bold">🔊</button>
          </div>`).join('');
      }

      // Render listening mode container
      const lb = document.getElementById('listen-box');
      if (LESSON_DATA.listening.mode === 'spot_the_lie') {
        lb.innerHTML = `
          <div class="p-3.5 bg-amber-50 border border-amber-200 rounded-2xl text-xs space-y-2">
            <p class="font-extrabold text-amber-950">🤥 Spot the 3 Mistakes in this summary:</p>
            <p class="bg-white p-3 rounded-xl border border-amber-100 font-semibold text-slate-800">"${esc(LESSON_DATA.listening.spotTheLieText)}"</p>
            <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="px-3 py-1 bg-amber-900 hover:bg-amber-800 text-white rounded-lg font-bold">Check Mistakes</button>
            <p class="hidden font-bold text-emerald-800 bg-white p-2.5 rounded-xl border border-emerald-200">${esc(LESSON_DATA.listening.spotTheLieKey)}</p>
          </div>`;
      } else if (LESSON_DATA.listening.mode === 'predict_ending') {
        lb.innerHTML = `<div class="p-3.5 bg-indigo-50 border border-indigo-100 rounded-2xl text-xs font-bold text-indigo-950">${esc(LESSON_DATA.listening.predictPrompt)}</div>`;
      } else {
        lb.innerHTML = `<ol class="list-decimal pl-5 text-xs sm:text-sm font-semibold text-slate-800 space-y-1.5">${LESSON_DATA.listening.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>`;
      }
    }

    window.onload = renderPart1;
  </script>
</body>
</html>
