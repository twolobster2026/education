<body class="min-h-screen pb-16 selection:bg-indigo-100 selection:text-indigo-900">

              <option value="vi">🇻🇳 Vietnamese (Tiếng Việt)</option>
              <option value="id">🇮🇩 Indonesian</option>
              <option value="th">🇹🇭 Thai</option>
            </optgroup>
            <optgroup label="Middle East &amp; South Asia">
              <option value="ar">🇸🇦 Arabic (العربية)</option>
              <option value="fa">🇮🇷 Persian (فارسی)</option>
              <option value="ur">🇵🇰 Urdu (اردو)</option>
              <option value="tr">🇹🇷 Turkish (Türkçe)</option>
              <option value="hi">🇮🇳 Hindi (हिन्दी)</option>
            </optgroup>
            <optgroup label="Europe &amp; Americas">
              <option value="es">🇪🇸 Spanish</option>
              <option value="pt">🇵🇹🇧🇷 Portuguese</option>
              <option value="fr">🇫🇷 French</option>
              <option value="de">🇩🇪 German</option>
              <option value="it">🇮🇹 Italian</option>
              <option value="ru">🇷🇺 Russian</option>
              <option value="uk">🇺🇦 Ukrainian</option>

            </optgroup>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <span class="px-2.5 py-1 bg-emerald-900/60 border border-emerald-500/40 rounded-lg text-xs font-bold text-emerald-300 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span> <span>Gemini 2.5 TTS Active</span>
          </span>
          <button onclick="changeFontSize(-1)" class="px-2 py-1 bg-slate-800 rounded text-xs font-bold">A-</button>

  <main id="app-main" class="max-w-4xl mx-auto px-4 pt-5 space-y-5"></main>

  <script>
    // =====================================================================
    // 🔊 INTERNAL GEMINI 2.5 FLASH TTS + 21-LANGUAGE TRANSLATION ENGINE
    // =====================================================================
    const apiKey = "";

    const VALID_VOICES = new Set(["Aoede", "Charon", "Fenrir", "Kore", "Leda", "Orus", "Puck", "Zephyr"]);
    function getSafeVoice(role) {
      if (VALID_VOICES.has(role)) return role;
      const v = LESSON_DATA.voices || { partner: "Aoede", student: "Zephyr", teacher: "Charon" };
      const r = role === 'partner' ? v.partner : (role === 'teacher' ? v.teacher : v.student);
      return VALID_VOICES.has(r) ? r : "Zephyr";
    }

    const audioCache = new Map();
    const sharedAudioPlayer = new Audio();

    function pcmToWav(base64Pcm, sampleRate = 24000) {
      const bin = atob(base64Pcm);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const buf = new ArrayBuffer(44 + bytes.length);
      const view = new DataView(buf);
      const ws = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      ws(view, 0, 'RIFF'); view.setUint32(4, 36 + bytes.length, true); ws(view, 8, 'WAVE'); ws(view, 12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true); ws(view, 36, 'data');
      view.setUint32(40, bytes.length, true);
      for (let i = 0; i < bytes.length; i++) view.setUint8(44 + i, bytes[i]);
      return URL.createObjectURL(new Blob([view], { type: 'audio/wav' }));
    }

    async function fetchGeminiTTS(text, voiceName = "Zephyr") {
      const clean = (text || "").trim();
      const ck = `${voiceName}:${clean}`;
      if (audioCache.has(ck)) return audioCache.get(ck);
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `Read this aloud naturally: ${clean}` }] }],
          generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } } },
          model: "gemini-2.5-flash-preview-tts"
        })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const wav = pcmToWav(data.candidates[0].content.parts[0].inlineData.data);
      audioCache.set(ck, wav);
      return wav;
    }

    async function speakText(text, btn, role = "student", rate = 1.0) {
      if (!text || !text.trim()) return;
      sharedAudioPlayer.pause();
      const orig = btn ? btn.innerHTML : "";
      if (btn) { btn.innerHTML = "⏳"; btn.disabled = true; }
      try {
        const wav = await fetchGeminiTTS(text, getSafeVoice(role));
        sharedAudioPlayer.src = wav;
        sharedAudioPlayer.playbackRate = rate;
        if (btn) btn.innerHTML = "🔊";
        sharedAudioPlayer.onended = () => { if (btn) { btn.innerHTML = orig; btn.disabled = false; } };
        await sharedAudioPlayer.play();
      } catch (e) { if (btn) { btn.innerHTML = orig; btn.disabled = false; } }
    }

    function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

    let fs = 16;
    function changeFontSize(d) { fs = Math.min(24, Math.max(12, fs + d * 2)); document.documentElement.style.fontSize = fs + 'px'; }

    async function translateTextDirect(txt) {
      if (!txt) return;
      document.getElementById('translate-modal').style.display = 'block';
      document.getElementById('t-modal-original').innerText = `"${txt}"`;
      const resEl = document.getElementById('t-modal-result');
      resEl.innerText = 'Translating...';
      const tl = document.getElementById('targetLanguage').value;
      try {
        const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${tl}&dt=t&q=${encodeURIComponent(txt)}`);
        const d = await r.json();
        resEl.dir = ['ar', 'fa', 'he', 'ur'].includes(tl) ? 'rtl' : 'ltr';
        resEl.innerText = d[0].map(c => c[0]).join('');
      } catch (e) { resEl.innerText = 'Translation unavailable.'; }
    }

    let selTxt = "";
    const tBtn = document.getElementById('highlight-translate-btn');
    document.addEventListener('mouseup', e => {
      if (e.target.closest('#highlight-translate-btn, #translate-modal')) return;
      setTimeout(() => {
        const s = window.getSelection().toString().trim();
        if (s.length > 1) {
          selTxt = s;
          const r = window.getSelection().getRangeAt(0).getBoundingClientRect();
          tBtn.style.left = `${Math.max(10, r.left + window.scrollX)}px`;
          tBtn.style.top = `${r.top + window.scrollY - 40}px`;
          tBtn.style.display = 'flex';
        } else tBtn.style.display = 'none';
      }, 15);
    });
    tBtn.onclick = () => { tBtn.style.display = 'none'; translateTextDirect(selTxt); };

    function initSharedHeader(badgeText) {
      document.getElementById('hdr-part-badge').innerText = badgeText;
      document.getElementById('page-title').innerText = `${LESSON_DATA.meta.level} · ${LESSON_DATA.meta.title}`;
      document.getElementById('hdr-level').innerText = LESSON_DATA.meta.level;
      document.getElementById('hdr-title').innerText = LESSON_DATA.meta.title;
      document.getElementById('hdr-grammar-topic').innerText = `Golden Thread: ${LESSON_DATA.meta.grammarTopic}`;
      if (LESSON_DATA.meta.recycledChunks) {
        document.getElementById('recycled-spine-bar').innerHTML = LESSON_DATA.meta.recycledChunks.map(c =>
          `<button data-s="${esc(c)}" onclick="speakText(this.dataset.s, this, 'student')" class="px-2 py-0.5 rounded bg-white/15 hover:bg-white/25 text-white text-[11px] font-bold">${esc(c)} 🔊</button>`
        ).join('');
      }
    }

    // =====================================================================
    // 📚 LESSON DATA: PART 3 (SPEAKING COACH + 200-WORD VISUAL STORY)
    // =====================================================================
    const LESSON_DATA = {
      meta: {
        level: "B1",
        title: "The Lion and the Mouse · Even the Smallest Can Help",
        grammarTopic: "Purpose & Result with 'so that'",
        recycledChunks: [
          "fall asleep",
          "beg for mercy",
          "let someone go",
          "get caught in a net",
          "chew through the rope",
          "keep a promise"
        ]
      },
      voices: { partner: "Aoede", student: "Zephyr", teacher: "Charon" },
      speakingBank: {
        part1: {
          title: "Round 1: Quick Questions (30s)",
          questions: [
            {
              q: "When did you last keep a promise to a friend or classmate, and how did it help them?",
              strategy: "State the promise clearly + use 'so that' to explain how it helped your friend.",
              starters: [
                "Last week, I promised to help my classmate so that...",
                "I kept my promise to my friend so that she could...",
                "Honestly, I always keep my promises so that people can..."
              ],
              connectors: [
                "Because of that, we finished our work early and...",
                "On top of that, it showed that I really cared about...",
                "Even though I was busy, I kept my word so that..."
              ],
              examples: [
                "For example, I lent her my English notes so that she could study.",
                "In the end, our friendship became much stronger."
              ],
              words: ["keep a promise (信守诺言)", "repay kindness (报恩)", "feel grateful (感激)"]
            },
            {
              q: "Why did the lion laugh when the tiny mouse promised to repay his kindness?",
              strategy: "Explain the lion's proud feelings + use 'so that' or contrast words.",
              starters: [
                "The lion laughed loudly because he thought he was...",
                "He felt amused so that he couldn't believe a small mouse...",
                "At first, the proud king thought that tiny creatures..."
              ],
              connectors: [
                "He believed only giant animals could help him, but...",
                "However, he showed mercy so that the little mouse...",
                "Little did he know that later on..."
              ],
              examples: [
                "For example, he saw how small her tiny paws were.",
                "He let her go freely so that she could run back home."
              ],
              words: ["beg for mercy (求饶)", "let someone go (释放某人)", "too proud (过于骄傲)"]
            },
            {
              q: "What should you do if you accidentally make a friend or teacher angry?",
              strategy: "Give a polite action step + explain the positive result using 'so that'.",
              starters: [
                "If I make a mistake, I immediately apologize so that...",
                "I think we should say sorry politely so that our friends...",
                "First, I explain what happened calmly so that..."
              ],
              connectors: [
                "That way, they understand it was an accident and...",
                "Just like the mouse begged for mercy, I always...",
                "After apologizing, I try to fix the problem so that..."
              ],
              examples: [
                "For instance, I offer to clean up or replace what broke.",
                "Then everyone feels peaceful and happy again."
              ],
              words: ["apologize politely (礼貌道歉)", "spare someone (宽恕某人)", "build trust (建立信任)"]
            }
          ]
        },
        part2: {
          title: "Round 2: 1–2 Min Story Card",
          questions: [
            {
              q: "Describe a time someone smaller, younger, or unexpected helped you solve a big problem.\n- who the person was and what trouble you had\n- what they did to help you\n- why this showed that size or age doesn't matter",
              strategy: "Follow the 4-part arc: Setting the Scene ➔ The Danger/Problem ➔ Unexpected Rescue ➔ The Lesson.",
              starters: [
                "I remember a time when my younger cousin helped me with...",
                "One day, I got caught in a really tricky situation at school...",
                "Just like the lion in the fable, I thought I didn't need help until..."
              ],
              connectors: [
                "Suddenly, they stepped forward so that I didn't have to worry...",
                "They used their special skill so that the problem was solved...",
                "Even though they were small, they worked tirelessly so that..."
              ],
              examples: [
                "For instance, my cousin found my lost keys under a tight shelf.",
                "In the end, it proved that loyal friends matter most."
              ],
              words: ["got caught in... (陷入困境)", "chew through (攻克难关)", "lifelong friends (终身挚友)"]
            }
          ]
        },
        part3: {
          title: "Round 3: Deeper Discussion (45s)",
          questions: [
            {
              q: "Why is loyalty and keeping promises more important in friendships than pure physical strength?",
              strategy: "Contrast inner character with physical power + give a real-life school example.",
              starters: [
                "In my opinion, loyalty is much more valuable because...",
                "Physical strength can't solve every problem, so friends need...",
                "True friends always keep their promises so that..."
              ],
              connectors: [
                "When someone gets caught in trouble, strong words mean nothing unless...",
                "On top of that, trust is built over time so that friends can...",
                "A small loyal friend is always better than a giant who..."
              ],
              examples: [
                "Just like the mouse chewed through the rope to save the king.",
                "That is why trustworthy people make the best companions."
              ],
              words: ["lifelong friends (终生朋友)", "trustworthy (值得信赖的)", "inner loyalty (内心忠诚)"]
            }
          ]
        }
      },
      feedbackPresets: {
        flow: [
          "👍 Great steady pace! Connect your two clauses cleanly with 'so that'.",
          "⏸️ Try starting immediately with: 'Last week, I kept my promise so that...'",
          "📏 Keep speaking smoothly without pausing after mentioning the problem!"
        ],
        fix: [
          "🔧 Use 'could' after past verbs: 'She helped so that he COULD escape' (not 'can').",
          "🔧 Say 'got caught IN a net', not 'caught ON a net'.",
          "🔧 Remember past simple: 'fell asleep', 'woke up', 'begged for mercy'."
        ],
        upgrade: [
          "⭐ Natural Upgrade: 'The mouse chewed through the rope so that the lion fell free.'",
          "⭐ High-scoring: 'The lion was not only mighty, but also generous.'",
          "⭐ Add a spoken starter: 'To be completely honest,' or 'Thankfully,'!"
        ]
      },
      story: {
        title: "📖 200-Word Visual Story: Even the Smallest Can Help (小身材，大力量)",
        scenes: [
          {
            sceneNum: 1,
            caption: "Scene 1: The Careless Step on the Hillside",
            imagePrompt: "A giant majestic sleeping lion under an acacia tree with a tiny trembling mouse caught under his paw, warm golden sunlight, storybook digital art",
            imageUrl: "https://images.unsplash.com/photo-1614027164847-1b28caa144b6?auto=format&fit=crop&w=900&q=80",
            text: "On a peaceful summer afternoon, a mighty lion lay under an acacia tree and [[fell asleep in the warm breeze]]. Nearby, a careless little mouse scampered right over the king's nose! The startled lion instantly [[woke up with a growl]], pinning the trembling creature beneath his heavy paw."
          },
          {
            sceneNum: 2,
            caption: "Scene 2: A Humble Promise Under the Claws",
            imagePrompt: "Tiny cute mouse looking up pleading with her paws together at a laughing amused lion, golden savanna, expressive fable illustration",
            imageUrl: "https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=900&q=80",
            text: "Frightened and helpless, the tiny mouse chose to [[beg for mercy]]. She cried, 'Please spare my life, Great King! I promise I will repay your kindness one day!' Amused by the idea that a tiny mouse could ever help him, the generous lion laughed and decided to [[let her go safely]]."
          },
          {
            sceneNum: 3,
            caption: "Scene 3: Trapped in the Hunter's Web",
            imagePrompt: "Proud lion hopelessly tangled in heavy rope netting hanging in a dense forest, roaring in distress, dramatic lighting",
            imageUrl: "https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=900&q=80",
            text: "Several days later, the proud lion accidentally stepped into a hidden rope trap and [[got caught in a net]]. The cords pulled tight so that he could not move at all. Helpless and exhausted, the king did nothing but [[roar in fear]], his cries echoing across the valley."
          },
          {
            sceneNum: 4,
            caption: "Scene 4: The Tiny Rescuer & Chewed Ropes",
            imagePrompt: "Small brave mouse biting through thick cords to free a gentle thankful lion, warm sunset friendship, cinematic children illustration",
            imageUrl: "https://images.unsplash.com/photo-1425082661705-1834bfd09dca?auto=format&fit=crop&w=900&q=80",
            text: "Hearing the roar, the little mouse rushed over to help. Using her sharp front teeth, she worked tirelessly to [[chew through the rope]] strand by strand. Soon the net snapped open so that the lion fell free! She had [[kept her promise]], and they became lifelong friends."
          }
        ]
      }
    };

    let curPart = 'part1', qIdx = 0, curStepView = 1, targetCefr = LESSON_DATA.meta.level || 'B1', helpLvl = 'more';
    let timerSecs = 30, timerLoop = null, storyMasked = false;

    function adaptCefr(item, lvl, detail) {
      const ch = LESSON_DATA.meta.recycledChunks || ["beg for mercy", "chew through the rope"];
      let st = [...item.starters], cn = [...item.connectors], ex = [...item.examples], strat = item.strategy;
      if (lvl === 'A1') {
        strat = "🌱 A1 Goal: Say 1–2 short sentences (5–6 words). Tell what the mouse did.";
        st = ["The mouse helped the lion.", "The lion was very happy.", "They are good friends."];
        cn = ["She chewed the rope.", "He ran away safely.", "I like this story."];
        ex = ["For example, she was brave.", "Now they are friends."];
      } else if (lvl === 'A2') {
        strat = "🌿 A2 Goal: Connect 2 simple clauses with 'so that' or 'because' (7–8 words).";
        st = ["The mouse helped so that the lion escaped.", "She kept her promise to the king.", "The lion let her go free."];
        cn = ["because she had very sharp teeth.", "so that he did not get hurt.", "and they walked away together."];
        ex = ["For example, she bit the rope.", "They became friends in the end."];
      } else if (lvl === 'B2') {
        strat = "🚀 B2 Goal: Use advanced discourse markers ('Honestly,', 'On top of that,') and complex cause-and-effect.";
        st = [
          "Honestly, loyalty is far more impactful than brute force because...",
          "When the lion was unexpectedly trapped, he realized that...",
          "To be completely frank, keeping your word builds enduring trust so that..."
        ],
        cn = [
          "On top of that, small gestures often yield the greatest loyalty, meaning...",
          "The main takeaway is that size never dictates one's character, so...",
          "Consequently, forgiving others opens the door to mutual support when..."
        ],
        ex = [
          "For instance, the mouse showed immense grit despite her tiny stature.",
          "That single act of mercy forged a lifelong bond between them."
        ];
      }
      if (detail === 'less') {
        const cut = a => a.map(s => s.split(' ').slice(0, 3).join(' ') + '...');
        st = cut(st); cn = cut(cn); ex = cut(ex);
      }
      return { strat, st, cn, ex, words: item.words || ch };
    }

    function renderPart3() {
      initSharedHeader("PART 3 · A1–B2 SPEAKING COACH & VISUAL STORY");
      const sec = LESSON_DATA.speakingBank[curPart];
      const list = sec.questions;
      const item = list[qIdx % list.length];
      const scaf = adaptCefr(item, targetCefr, helpLvl);

      document.getElementById('app-main').innerHTML = `
        <!-- Top Speaking Navigation & Question Card -->
        <div class="bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-sm">
          <div class="flex flex-wrap justify-between items-center gap-2">
            <div class="flex bg-slate-100 p-1 rounded-xl gap-1">
              ${['part1','part2','part3'].map((p,i) => `<button onclick="curPart='${p}'; qIdx=0; renderPart3()" class="px-3.5 py-1.5 rounded-lg text-xs font-extrabold transition ${curPart===p?'bg-indigo-600 text-white shadow-xs':'text-slate-600 hover:text-slate-900'}">Round ${i+1}</button>`).join('')}
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="qIdx=(qIdx-1+${list.length})%${list.length}; renderPart3()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition">← Prev</button>
              <span class="text-xs font-black text-slate-400 px-1">${(qIdx%list.length)+1} / ${list.length}</span>
              <button onclick="qIdx=(qIdx+1)%${list.length}; renderPart3()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-bold transition">Next →</button>
            </div>
          </div>
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 flex justify-between items-start gap-3">
            <div class="text-base sm:text-lg font-extrabold text-slate-900 whitespace-pre-line flex-1 leading-snug">${esc(item.q)}</div>
            <div class="flex gap-1.5 shrink-0">
              <button data-s="${esc(item.q)}" onclick="speakText(this.dataset.s,this,'teacher')" class="px-3 py-1.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 rounded-xl text-xs font-extrabold transition">🔊</button>
              <button data-s="${esc(item.q)}" onclick="translateTextDirect(this.dataset.s)" class="px-2.5 py-1.5 bg-white border border-slate-200 hover:bg-slate-100 rounded-xl text-xs font-bold">🌍</button>
            </div>
          </div>
        </div>

        <!-- 3-Step Mode Switcher -->
        <div class="grid grid-cols-3 gap-2 bg-slate-200/80 p-1.5 rounded-2xl shadow-inner">
          ${['Step 1: AI Coach & Fragments','Step 2: Speak (Timer)','Step 3: Quick Fix & 30s Retry'].map((lbl,i) => `<button onclick="curStepView=${i+1}; renderPart3()" class="py-2.5 px-2 text-center rounded-xl font-extrabold text-xs sm:text-sm transition ${curStepView===i+1?'bg-white text-indigo-700 shadow-sm':'text-slate-600 hover:text-slate-900'}">${lbl}</button>`).join('')}
        </div>

        <!-- Step 1: Fragment Scaffold & Draft Builder -->
        ${curStepView === 1 ? `<section class="bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-sm">
          <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-100 pb-3">
            <div class="flex items-center bg-slate-100 p-1 rounded-xl gap-1">
              <span class="text-[10px] font-black uppercase text-slate-400 px-2 tracking-wider">CEFR:</span>
              ${['A1','A2','B1','B2'].map(l => `<button onclick="targetCefr='${l}'; renderPart3()" class="px-2.5 py-1 rounded-lg text-xs font-extrabold transition ${targetCefr===l?'bg-indigo-600 text-white shadow-xs':'text-slate-600 hover:text-slate-900'}">${l}</button>`).join('')}
            </div>
            <div class="flex items-center bg-slate-100 p-1 rounded-xl gap-1">
              ${[['more','🟢 More Detailed'],['less','🟡 Less Detailed'],['none','🔴 No Chunks']].map(([k,v]) => `<button onclick="helpLvl='${k}'; renderPart3()" class="px-2.5 py-1 rounded-lg text-xs font-extrabold transition ${helpLvl===k?'bg-emerald-600 text-white shadow-xs':'text-slate-600 hover:text-slate-900'}">${v}</button>`).join('')}
            </div>
          </div>

          ${helpLvl === 'none' ? `<div class="p-6 bg-rose-50 border border-rose-200 rounded-2xl text-center text-xs sm:text-sm font-bold text-rose-700 space-y-1">
            <p>🔴 No Chunks Mode Active</p>
            <p class="font-normal text-rose-600">Challenge yourself to build your ${targetCefr} response from memory using 'so that'!</p>
          </div>` : `
            <p class="text-xs font-bold text-violet-800 bg-violet-50/80 p-3 rounded-xl border border-violet-200">💡 ${esc(scaf.strat)}</p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              ${[['1. Start Your Reply', scaf.st, 'bg-emerald-50/80 border-emerald-200 text-emerald-950'], ['2. Add Reason / Detail', scaf.cn, 'bg-indigo-50/80 border-indigo-200 text-indigo-950'], ['3. Example / Wrap Up', scaf.ex, 'bg-amber-50/80 border-amber-200 text-amber-950']].map(([title, arr, cls]) => `
                <div class="space-y-2">
                  <div class="text-[11px] font-black uppercase text-slate-600 tracking-wider">${title}</div>
                  ${arr.map(f => `<div class="p-2.5 rounded-xl border ${cls} text-xs font-bold flex justify-between items-center gap-1.5 shadow-2xs hover:border-slate-400 transition">
                    <button data-s="${esc(f)}" onclick="insertFrag(this.dataset.s)" class="text-left flex-1 hover:underline leading-snug">${esc(f)}</button>
                    <div class="flex gap-1 shrink-0">
                      <button data-s="${esc(f.replace(/\.\.\.$/,''))}" onclick="speakText(this.dataset.s,this,'student')" class="px-1.5 py-0.5 bg-white border border-slate-200 rounded text-[10px]">🔊</button>
                      <button data-s="${esc(f)}" onclick="translateTextDirect(this.dataset.s)" class="px-1.5 py-0.5 bg-white border border-slate-200 rounded text-[10px]">🌍</button>
                    </div>
                  </div>`).join('')}
                </div>`).join('')}
            </div>

            <!-- Recycled Vocabulary Badges -->
            <div class="pt-1">
              <span class="text-[11px] font-extrabold uppercase text-slate-400 block mb-1.5">🔑 Key Vocabulary for this Prompt:</span>
              <div class="flex flex-wrap gap-1.5">
                ${scaf.words.map(w => `<span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-semibold">${esc(w)}</span>`).join('')}
              </div>
            </div>
          `}

          <!-- Live Reply Builder & AI Check -->
          <div class="bg-indigo-50/70 border border-indigo-200 rounded-2xl p-4 space-y-2.5 shadow-xs">
            <div class="flex justify-between items-center">
              <span class="text-xs font-black uppercase text-indigo-900 tracking-wide">✍️ Practice Building Your Spoken Reply (${targetCefr}):</span>
              <button onclick="speakText(document.getElementById('reply-box').value,this,'student')" class="text-xs font-extrabold text-indigo-700 hover:underline">🔊 Listen Draft</button>
            </div>
            <textarea id="reply-box" rows="2" class="w-full p-3 rounded-xl bg-white border border-slate-200 focus:border-indigo-500 focus:outline-none text-xs sm:text-sm leading-relaxed" placeholder="Click fragments above to assemble your response or type your answer..."></textarea>
            <div class="flex flex-wrap gap-2 pt-1">
              <button onclick="checkReplyAI()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-extrabold transition shadow-xs">🤖 Coach My Reply (${targetCefr})</button>
              <button onclick="curStepView=2; renderPart3()" class="px-4 py-2 bg-white border border-indigo-300 hover:bg-indigo-50 text-indigo-700 rounded-xl text-xs font-bold transition">Go to Step 2 Timer ➔</button>
            </div>
            <div id="ai-eval-out" class="space-y-2 pt-1"></div>
          </div>
        </section>` : ''}

        <!-- Step 2: Full-Screen Speaking Timer -->
        ${curStepView === 2 ? `<section class="bg-white border border-slate-200 rounded-3xl p-8 text-center space-y-5 shadow-sm">
          <div class="max-w-md mx-auto space-y-1">
            <span class="text-xs font-black uppercase text-slate-400 tracking-wider">Oral Delivery Challenge</span>
            <h3 class="font-extrabold text-base text-slate-900">Deliver your response out loud to your teacher or partner!</h3>
          </div>
          <div class="flex justify-center gap-2">
            ${[30, 45, 60, 90].map(s => `<button onclick="timerSecs=${s}; document.getElementById('t-disp').innerText=fmtTime(${s})" class="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold transition ${timerSecs===s?'border-2 border-indigo-500 text-indigo-700 font-extrabold':''}">${s}s</button>`).join('')}
          </div>
          <div id="t-disp" class="text-7xl font-black text-slate-900 tabular-nums my-4">${fmtTime(timerSecs)}</div>
          <div class="flex justify-center gap-3">
            <button onclick="toggleCoachTimer(this)" class="px-8 py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-sm shadow-md transition">▶ Start Speaking</button>
            <button onclick="curStepView=3; renderPart3()" class="px-6 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm shadow-md transition">Step 3: Teacher Feedback ➔</button>
          </div>
        </section>` : ''}

        <!-- Step 3: Quick Fix, Polish & 30s Retry -->
        ${curStepView === 3 ? `<section class="bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-sm">
          <div class="flex justify-between items-center border-b border-slate-100 pb-2">
            <div>
              <span class="text-[10px] font-black uppercase text-indigo-600 tracking-wider">Targeted Feedback Matrix</span>
              <h3 class="font-extrabold text-sm text-slate-900">Click a preset below or type your custom coaching note:</h3>
            </div>
            <span class="text-xs font-bold text-slate-400">CEFR B1 Target</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            ${[['flow','1. Flow & Delivery',LESSON_DATA.feedbackPresets.flow,'emerald'],['fix','2. Fix Grammar (so that)',LESSON_DATA.feedbackPresets.fix,'rose'],['up','3. Natural Upgrade',LESSON_DATA.feedbackPresets.upgrade,'amber']].map(([id,lbl,arr,c]) => `
              <div class="bg-${c}-50/70 border border-${c}-200 rounded-2xl p-3.5 space-y-2">
                <span class="text-xs font-black uppercase text-${c}-800 tracking-wide">${lbl}</span>
                <div class="space-y-1.5">
                  ${arr.map(t => `<button data-s="${esc(t)}" onclick="document.getElementById('fb-${id}').value=this.dataset.s" class="w-full text-left p-2 rounded-xl bg-white border border-slate-200 hover:border-${c}-400 text-xs font-semibold text-slate-800 leading-snug transition">${esc(t)}</button>`).join('')}
                </div>
                <input id="fb-${id}" placeholder="Type notes here..." class="w-full p-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold text-slate-900 focus:outline-none">
              </div>`).join('')}
          </div>

          <div class="bg-gradient-to-r from-indigo-950 via-slate-900 to-indigo-950 text-white rounded-2xl p-5 flex flex-wrap justify-between items-center gap-4 shadow-md">
            <div>
              <h3 class="font-extrabold text-sm text-amber-300">🔥 Immediate 30-Second Speaking Retry!</h3>
              <p class="text-xs text-indigo-200 mt-0.5">Answer the same question once more, incorporating the feedback points above.</p>
            </div>
            <button onclick="this.innerText='⏱️ 30s Timer Running!'; setTimeout(()=>this.innerText='▶ Start 30s Retry', 30000)" class="px-6 py-2.5 bg-emerald-400 hover:bg-emerald-300 text-slate-950 rounded-xl text-xs font-black shadow-sm transition">▶ Start 30s Retry</button>
          </div>
        </section>` : ''}

        <!-- 200-Word Visual Story Section -->
        <details class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm" open>
          <summary class="p-4 bg-amber-50/80 cursor-pointer font-extrabold text-sm text-slate-900 flex justify-between items-center hover:bg-amber-100/70 transition">
            <span class="flex items-center gap-2"><span>🦁🐭</span> <span>${esc(LESSON_DATA.story.title)}</span></span>
            <span class="text-xs bg-amber-200 text-amber-900 px-3 py-1 rounded-xl font-bold">4 Illustrated Scenes · Cloze</span>
          </summary>
          <div class="p-5 space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-100 pb-3">
              <span class="text-xs text-slate-500 font-semibold">Click any highlighted chunk to toggle the yellow cloze mask!</span>
              <div class="flex gap-2">
                <button onclick="speakText(LESSON_DATA.story.scenes.map(s=>s.text.replace(/\\[\\[(.*?)\\]\\]/g,'$1')).join(' '),this,'teacher')" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-xs">▶️ Listen Full Story</button>
                <button onclick="storyMasked=!storyMasked; renderPart3()" class="px-3 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-950 rounded-xl text-xs font-bold transition">🕳️ Hide/Show Chunks</button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${LESSON_DATA.story.scenes.map(sc => {
                const clean = sc.text.replace(/\[\[(.*?)\]\]/g, '$1');
                const html = sc.text.replace(/\[\[(.*?)\]\]/g, (_, c) => `<span class="story-cloze ${storyMasked?'masked':''}" onclick="this.classList.toggle('masked')">${esc(c)}</span>`);
                return `<div class="border border-slate-200 rounded-2xl overflow-hidden bg-slate-50/50 flex flex-col justify-between shadow-2xs hover:shadow-sm transition">
                  <div class="relative">
                    <img src="${sc.imageUrl}" alt="${esc(sc.caption)}" class="w-full h-44 object-cover" onerror="this.src='https://placehold.co/600x300/1e293b/ffffff?text=${encodeURIComponent(sc.caption)}'">
                    <span class="absolute bottom-2 left-2 px-2.5 py-1 rounded-lg bg-black/60 text-white text-[11px] font-black backdrop-blur-xs">${esc(sc.caption)}</span>
                  </div>
                  <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                    <p class="text-xs sm:text-sm text-slate-800 leading-relaxed">${html}</p>
                    <div class="flex justify-end gap-1.5 pt-2 border-t border-slate-200/60">
                      <button data-s="${esc(clean)}" onclick="speakText(this.dataset.s,this,'teacher')" class="px-2.5 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg text-xs font-bold">🔊 Listen</button>
                      <button data-s="${esc(clean)}" onclick="translateTextDirect(this.dataset.s)" class="px-2.5 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg text-xs font-bold">🌍 Translate</button>
                    </div>
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>
        </details>`;
    }

    function fmtTime(s) { 
      return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; 
    }

    function insertFrag(txt) { 
      const b = document.getElementById('reply-box'); 
      if (!b) return;
      b.value = (b.value ? b.value.trim() + ' ' : '') + txt.replace(/\.\.\.$/, '').trim() + ' '; 
      b.focus(); 
    }

    function toggleCoachTimer(btn) {
      if (timerLoop) { 
        clearInterval(timerLoop); 
        timerLoop = null; 
        btn.innerText = '▶ Start Speaking'; 
        btn.classList.replace('bg-amber-600', 'bg-emerald-600');
      } else { 
        btn.innerText = '⏸ Pause Timer'; 
        btn.classList.replace('bg-emerald-600', 'bg-amber-600');
        timerLoop = setInterval(() => { 
          if (timerSecs > 0) { 
            timerSecs--; 
            const d = document.getElementById('t-disp');
            if (d) d.innerText = fmtTime(timerSecs); 
          } else { 
            clearInterval(timerLoop); 
            timerLoop = null; 
            btn.innerText = '✅ Time Up!';
          } 
        }, 1000); 
      }
    }

    async function checkReplyAI() {
      const b = document.getElementById('reply-box');
      if (!b) return;
      const val = b.value.trim();
      const out = document.getElementById('ai-eval-out');
      if (!val) return;
      out.innerHTML = `<div class="text-xs font-bold text-indigo-700 animate-pulse p-2 bg-indigo-50 rounded-xl">✨ Analyzing your ${targetCefr} reply with Gemini AI...</div>`;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: `Student (${targetCefr}) oral draft: "${val}". Lesson topic: The Lion and the Mouse. Target grammar: Expressing purpose/results with "so that". Return concise JSON: {"praise":"...","fix":"...","polished":"..."}` }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });
        if (!res.ok) throw new Error('API error');
        const d = await res.json();
        const p = JSON.parse(d.candidates[0].content.parts[0].text.replace(/```json|```/g,'').trim());
        out.innerHTML = `
          <div class="p-3.5 bg-white border border-emerald-200 rounded-xl text-xs space-y-1.5 shadow-2xs">
            <p><strong class="text-emerald-800">👍 Strength:</strong> ${esc(p.praise)}</p>
            <p class="text-rose-700"><strong class="text-rose-800">🔧 Improvement:</strong> ${esc(p.fix)}</p>
            <div class="flex flex-wrap justify-between items-center pt-1.5 border-t border-slate-100 gap-1">
              <strong class="text-indigo-900">🗣️ Polished Spoken Version: "${esc(p.polished)}"</strong>
              <button data-s="${esc(p.polished)}" onclick="speakText(this.dataset.s,this,'student')" class="px-2 py-0.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-900 rounded font-bold">🔊</button>
            </div>
          </div>`;
      } catch (e) {
        out.innerHTML = `<div class="p-3 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700">✅ Great draft! Remember to connect your ideas with <em>'so that'</em> to clearly explain the purpose or result.</div>`;
      }
    }

    window.onload = renderPart3;
  </script>
</body>
</html>
