            <span class="w-2 h-2 rounded-full bg-emerald-400"></span> <span>Gemini 2.5 TTS Active</span>

  <main id="app-main" class="max-w-4xl mx-auto px-4 pt-5 space-y-5"></main>

  <script>
    // =====================================================================
    // 🔊 INTERNAL GEMINI 2.5 FLASH TTS + 21-LANGUAGE TRANSLATION ENGINE
    // =====================================================================
    const apiKey = "";

    const VALID_VOICES = new Set(["Aoede", "Charon", "Fenrir", "Kore", "Leda", "Orus", "Puck", "Zephyr"]);
    function getSafeVoice(role) {
      if (VALID_VOICES.has(role)) return role;
      const v = LESSON_DATA.voices || { partner: "Aoede", student: "Zephyr", teacher: "Charon" };
      const r = role === 'partner' ? v.partner : (role === 'teacher' ? v.teacher : v.student);
      return VALID_VOICES.has(r) ? r : "Zephyr";
    }

    const audioCache = new Map();
    const sharedAudioPlayer = new Audio();

    function pcmToWav(base64Pcm, sampleRate = 24000) {
      const bin = atob(base64Pcm);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const buf = new ArrayBuffer(44 + bytes.length);
      const view = new DataView(buf);
      const ws = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      ws(view, 0, 'RIFF'); view.setUint32(4, 36 + bytes.length, true); ws(view, 8, 'WAVE'); ws(view, 12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true); ws(view, 36, 'data');
      view.setUint32(40, bytes.length, true);
      for (let i = 0; i < bytes.length; i++) view.setUint8(44 + i, bytes[i]);
      return URL.createObjectURL(new Blob([view], { type: 'audio/wav' }));
    }

    async function fetchGeminiTTS(text, voiceName = "Zephyr") {
      const clean = (text || "").trim();
      const ck = `${voiceName}:${clean}`;
      if (audioCache.has(ck)) return audioCache.get(ck);
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `Read this aloud naturally: ${clean}` }] }],
          generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } } },
          model: "gemini-2.5-flash-preview-tts"
        })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const wav = pcmToWav(data.candidates[0].content.parts[0].inlineData.data);
      audioCache.set(ck, wav);
      return wav;
    }

    async function speakText(text, btn, role = "student", rate = 1.0) {
      if (!text || !text.trim()) return;
      sharedAudioPlayer.pause();
      const orig = btn ? btn.innerHTML : "";
      if (btn) { btn.innerHTML = "⏳"; btn.disabled = true; }
      try {
        const wav = await fetchGeminiTTS(text, getSafeVoice(role));
        sharedAudioPlayer.src = wav;
        sharedAudioPlayer.playbackRate = rate;
        if (btn) btn.innerHTML = "🔊";
        sharedAudioPlayer.onended = () => { if (btn) { btn.innerHTML = orig; btn.disabled = false; } };
        await sharedAudioPlayer.play();
      } catch (e) { if (btn) { btn.innerHTML = orig; btn.disabled = false; } }
    }

    function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }

    let fs = 16;
    function changeFontSize(d) { fs = Math.min(24, Math.max(12, fs + d * 2)); document.documentElement.style.fontSize = fs + 'px'; }

    async function translateTextDirect(txt) {
      if (!txt) return;
      document.getElementById('translate-modal').style.display = 'block';
      document.getElementById('t-modal-original').innerText = `"${txt}"`;
      const resEl = document.getElementById('t-modal-result');
      resEl.innerText = 'Translating...';
      const tl = document.getElementById('targetLanguage').value;
      try {
        const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${tl}&dt=t&q=${encodeURIComponent(txt)}`);
        const d = await r.json();
        resEl.dir = ['ar', 'fa', 'he', 'ur'].includes(tl) ? 'rtl' : 'ltr';
        resEl.innerText = d[0].map(c => c[0]).join('');
      } catch (e) { resEl.innerText = 'Translation unavailable.'; }
    }

    let selTxt = "";
    const tBtn = document.getElementById('highlight-translate-btn');
    document.addEventListener('mouseup', e => {
      if (e.target.closest('#highlight-translate-btn, #translate-modal')) return;
      setTimeout(() => {
        const s = window.getSelection().toString().trim();
        if (s.length > 1) {
          selTxt = s;
          const r = window.getSelection().getRangeAt(0).getBoundingClientRect();
          tBtn.style.left = `${Math.max(10, r.left + window.scrollX)}px`;
          tBtn.style.top = `${r.top + window.scrollY - 40}px`;
          tBtn.style.display = 'flex';
        } else tBtn.style.display = 'none';
      }, 15);
    });
    tBtn.onclick = () => { tBtn.style.display = 'none'; translateTextDirect(selTxt); };

    function initSharedHeader(badgeText) {
      document.getElementById('hdr-part-badge').innerText = badgeText;
      document.getElementById('page-title').innerText = `${LESSON_DATA.meta.level} · ${LESSON_DATA.meta.title}`;
      document.getElementById('hdr-level').innerText = LESSON_DATA.meta.level;
      document.getElementById('hdr-title').innerText = LESSON_DATA.meta.title;
      document.getElementById('hdr-grammar-topic').innerText = `Golden Thread: ${LESSON_DATA.meta.grammarTopic}`;
      if (LESSON_DATA.meta.recycledChunks) {
        document.getElementById('recycled-spine-bar').innerHTML = LESSON_DATA.meta.recycledChunks.map(c =>
          `<button data-s="${esc(c)}" onclick="speakText(this.dataset.s, this, 'student')" class="px-2 py-0.5 rounded bg-white/15 hover:bg-white/25 text-white text-[11px] font-bold">${esc(c)} 🔊</button>`
        ).join('');
      }
    }

    // =====================================================================
    // 📚 LESSON DATA: PART 2 (DIALOGUES & CALM 4-SENTENCE STORY BUILDER)
    // =====================================================================
    const LESSON_DATA = {
      meta: {
        level: "B1",
        title: "The Lion and the Mouse · Even the Smallest Can Help",
        grammarTopic: "Purpose & Result with 'so that'",
        recycledChunks: [
          "fall asleep",
          "beg for mercy",
          "let someone go",
          "get caught in a net",
          "chew through the rope",
          "keep a promise"
        ]
      },
      voices: { partner: "Aoede", student: "Zephyr", teacher: "Charon" },
      scenes: {
        1: {
          title: "💬 Scene 1: English Class Story Recap (Under the Acacia Tree)",
          swapPrompt: "Now roleplay with your partner: tell them why you let a classmate go or gave someone a second chance!",
          turns: [
            {
              role: "partner",
              name: "P",
              text: "Hey Linda! Why did the lion wake up so angrily?"
            },
            {
              role: "you",
              name: "L",
              start: "Well, he had just",
              cloze: "fallen fast asleep",
              end: "when the little mouse ran over his nose."
            },
            {
              role: "partner",
              name: "P",
              text: "Oh no! Did the lion crush her with his paw?"
            },
            {
              role: "you",
              name: "L",
              start: "No, she politely",
              cloze: "begged for mercy",
              end: "so that he spared her life."
            },
            {
              role: "partner",
              name: "P",
              text: "Did the lion actually believe her promise to help him?"
            },
            {
              role: "you",
              name: "L",
              start: "He laughed loudly, but",
              cloze: "let her go safely",
              end: "so that she could run home."
            }
          ]
        },
        2: {
          title: "💬 Scene 2: The Forest Rescue (Small Friends, Big Help)",
          swapPrompt: "Tell your partner about a time someone smaller or younger helped you fix a real problem!",
          turns: [
            {
              role: "partner",
              name: "P",
              text: "What happened when the hunters set traps in the valley?"
            },
            {
              role: "you",
              name: "L",
              start: "The poor lion",
              cloze: "got caught in a net",
              end: "so that he could not move at all."
            },
            {
              role: "partner",
              name: "P",
              text: "Did anyone hear him when he roared in fear?"
            },
            {
              role: "you",
              name: "L",
              start: "Yes! The little mouse ran quickly",
              cloze: "so that she could find",
              end: "her trapped friend."
            },
            {
              role: "partner",
              name: "P",
              text: "How did such a tiny animal break those heavy cords?"
            },
            {
              role: "you",
              name: "L",
              start: "She carefully",
              cloze: "chewed through the rope",
              end: "so that the king fell free and safe!"
            }
          ]
        }
      },
      fluency: {
        topicCards: [
          {
            tag: "TOPIC 1 · THE FABLE RETELLING",
            question: "Retell the fable in 4 clear spoken sentences using 'so that':",
            freeTwist: "If the lion had refused to let the mouse go, what would have happened to him later?",
            steps: [
              {
                label: "Sentence 1 · Encounter",
                prompt: "How did the story begin on the sunny afternoon?",
                frame: "On a warm afternoon, the lion",
                ideas: [
                  "fell fast asleep under the acacia tree",
                  "rested quietly in the warm breeze",
                  "woke up when a mouse crossed his nose"
                ],
                details: ["before the day grew hot", "near the open hillside"]
              },
              {
                label: "Sentence 2 · The Promise",
                prompt: "Why did the mighty lion decide to spare her?",
                frame: "The little mouse begged for mercy",
                ideas: [
                  "so that the lion kindly let her go",
                  "so that she could promise to return the favor",
                  "so that she escaped without any harm"
                ],
                details: ["with tears in her eyes", "and he smiled warmly"]
              },
              {
                label: "Sentence 3 · Danger",
                prompt: "What serious trouble did the lion face in the woods?",
                frame: "Days later, the mighty lion",
                ideas: [
                  "got caught in a hunter's rope net",
                  "stepped into a hidden trap",
                  "roared in fear high in the air"
                ],
                details: ["while walking down the path", "and could not escape"]
              },
              {
                label: "Sentence 4 · Rescue",
                prompt: "How did the mouse keep her word and save the king?",
                frame: "The mouse chewed through the rope",
                ideas: [
                  "so that the grateful lion escaped safely",
                  "so that the king became her lifelong friend",
                  "so that he knew small friends matter"
                ],
                details: ["strand by strand", "before hunters arrived"]
              }
            ]
          },
          {
            tag: "TOPIC 2 · REAL-LIFE KINDNESS",
            question: "Tell a 4-sentence personal story about helping or forgiving someone:",
            freeTwist: "Why is it sometimes harder to forgive someone than to stay angry?",
            steps: [
              {
                label: "Sentence 1 · The Mistake",
                prompt: "What mistake happened between you and a classmate?",
                frame: "One day, a younger classmate accidentally",
                ideas: [
                  "spilled water all over my English notebook",
                  "broke my favorite ruler in class",
                  "stepped on my backpack in the hallway"
                ],
                details: ["during lunch break", "right before afternoon class"]
              },
              {
                label: "Sentence 2 · Forgiveness",
                prompt: "How did you show kindness or patience?",
                frame: "He apologized politely so that I",
                ideas: [
                  "smiled and forgave him right away",
                  "decided not to get angry with him",
                  "helped him clean up the mess calmly"
                ],
                details: ["without any complaint", "because mistakes happen"]
              },
              {
                label: "Sentence 3 · The Dilemma",
                prompt: "What problem did you encounter later that week?",
                frame: "Later that week, I got caught in",
                ideas: [
                  "a difficult math homework problem",
                  "a sudden rainstorm without an umbrella",
                  "a rush to finish our school project"
                ],
                details: ["after school ended", "and didn't know what to do"]
              },
              {
                label: "Sentence 4 · Repaying Kindness",
                prompt: "How did that friend return your kindness?",
                frame: "He offered his help immediately so that",
                ideas: [
                  "we solved the whole problem together",
                  "I stayed dry and walked home safely",
                  "we became very close friends"
                ],
                details: ["just like the mouse in the fable", "with big smiles on our faces"]
              }
            ]
          }
        ]
      }
    };

    let curTopic = 0, curStep = 0, supportLvl = 1, fadeLvl = 0, builderState = {};

    function initPart2() {
      LESSON_DATA.fluency.topicCards.forEach((c, tIdx) => {
        builderState[tIdx] = c.steps.map(st => ({ idea: st.ideas[0], detail: "", custom: "" }));
      });
      renderPart2();
    }

    function buildSent(st, slot) {
      if (slot.custom && slot.custom.trim()) return slot.custom.trim();
      const r = `${st.frame} ${slot.idea || "..."} ${slot.detail || ""}`.replace(/\s+/g, ' ').trim();
      return /[.!?]$/.test(r) ? r : r + ".";
    }

    function renderPart2() {
      initSharedHeader("PART 2 · DIALOGUES & 4-SENTENCE STORY BUILDER");
      const card = LESSON_DATA.fluency.topicCards[curTopic];
      const stArr = builderState[curTopic];
      const st = card.steps[curStep];
      const slot = stArr[curStep];
      const curSent = buildSent(st, slot);

      document.getElementById('app-main').innerHTML = `
        <!-- Section 1: Two 6-Turn Dialogues -->
        ${[1, 2].map(n => {
          const sc = LESSON_DATA.scenes[n];
          return `<section class="bg-white rounded-3xl border border-slate-200 p-5 space-y-3.5 shadow-sm">
            <div class="flex flex-wrap justify-between items-center gap-2">
              <div>
                <span class="text-[10px] font-black uppercase text-indigo-600 tracking-wider">Turn-Taking Practice</span>
                <h2 class="font-extrabold text-base text-slate-900">${esc(sc.title)}</h2>
              </div>
              <div class="flex gap-1.5">
                <button onclick="document.querySelectorAll('#dlg-${n} .cloze-target').forEach(c=>c.classList.toggle('cloze-masked'))" class="px-3 py-1 rounded-xl bg-indigo-100 hover:bg-indigo-200 text-indigo-800 text-xs font-bold transition">🕳️ Cloze Mask</button>
                <button onclick="document.querySelectorAll('#dlg-${n} .sent-txt').forEach(s=>s.classList.toggle('blurred-text'))" class="px-3 py-1 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold transition">🙈 Blindfold</button>
              </div>
            </div>

            <div id="dlg-${n}" class="space-y-2.5">
              ${sc.turns.map(t => {
                const isYou = t.role === 'you';
                const full = isYou ? `${t.start} ${t.cloze} ${t.end}`.replace(/ '/g, "'") : t.text;
                const html = isYou ? `${esc(t.start)} <span class="cloze-target" onclick="this.classList.remove('cloze-masked')">${esc(t.cloze)}</span> ${esc(t.end)}` : esc(t.text);
                return `<div class="flex items-center gap-2.5 ${isYou?'flex-row-reverse':''}">
                  <div class="w-7 h-7 rounded-full ${isYou?'bg-indigo-600 text-white shadow-xs':'bg-slate-200 text-slate-700'} flex items-center justify-center font-extrabold text-[11px] shrink-0">${t.name}</div>
                  <div class="max-w-[85%] ${isYou?'bubble-you shadow-sm':'bubble-partner shadow-2xs'} py-2.5 px-4 rounded-2xl text-xs sm:text-sm font-medium flex justify-between items-center gap-3">
                    <p class="sent-txt flex-1 leading-relaxed cursor-pointer" onclick="this.classList.remove('blurred-text')">${html}</p>
                    <div class="flex gap-1 shrink-0">
                      <button data-s="${esc(full)}" data-r="${t.role}" onclick="speakText(this.dataset.s,this,this.dataset.r)" class="px-2 py-0.5 rounded-lg ${isYou?'bg-white/20 hover:bg-white/30 text-white':'bg-slate-100 hover:bg-slate-200 text-slate-700'} text-[11px] font-bold">🔊</button>
                      <button data-s="${esc(full)}" onclick="translateTextDirect(this.dataset.s)" class="px-2 py-0.5 rounded-lg ${isYou?'bg-white/20 hover:bg-white/30 text-white':'bg-slate-100 hover:bg-slate-200 text-slate-700'} text-[11px] font-bold">🌍</button>
                    </div>
                  </div>
                </div>`;
              }).join('')}
            </div>

            <div class="p-3 bg-indigo-50/70 border border-indigo-200/80 rounded-2xl text-xs font-bold text-indigo-950 flex items-center justify-between gap-2">
              <span>🎙️ Real-Life Swap: ${esc(sc.swapPrompt)}</span>
              <button onclick="speakText('${esc(sc.swapPrompt)}',this,'teacher')" class="px-2.5 py-1 bg-white border border-indigo-200 rounded-lg text-xs font-bold shrink-0">🔊 Task</button>
            </div>
          </section>`;
        }).join('')}

        <!-- Section 2: Calm 4-Sentence Story Builder -->
        <section class="bg-white rounded-3xl border border-slate-200 p-5 space-y-4 shadow-sm">
          <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-100 pb-3">
            <div>
              <span class="text-[10px] font-extrabold uppercase text-teal-700 tracking-wider">${esc(card.tag)}</span>
              <h2 class="font-extrabold text-base text-slate-900">${esc(card.question)}</h2>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-bold text-slate-400 mr-1">Scaffold:</span>
              ${[1, 2, 3].map(l => `<button onclick="supportLvl=${l}; renderPart2()" class="px-3 py-1 rounded-xl text-xs font-extrabold transition ${supportLvl===l?'bg-teal-600 text-white shadow-xs':'bg-slate-100 hover:bg-slate-200 text-slate-700'}">Lvl ${l}${l===1?' (Guided)':l===2?' (Frames)':' (Free)'}</button>`).join('')}
            </div>
          </div>

          <!-- Topic Selector -->
          <div class="flex gap-2">
            ${LESSON_DATA.fluency.topicCards.map((c, i) => `<button onclick="curTopic=${i}; curStep=0; renderPart2()" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition ${curTopic===i?'bg-teal-700 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200'}">Card ${i+1}: ${c.tag.split('·')[1] || c.tag}</button>`).join('')}
          </div>

          <!-- Step Tabs -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            ${card.steps.map((s, i) => `<button onclick="curStep=${i}; renderPart2()" class="p-2.5 rounded-2xl border text-left text-xs font-bold transition ${curStep===i?'bg-teal-600 text-white border-teal-600 shadow-sm':'bg-slate-50 border-slate-200 hover:bg-teal-50/50 text-slate-700'}">
              <span class="text-[10px] uppercase font-black block opacity-75">Step ${i+1}</span>
              ${esc(s.label.split('·')[1] || s.label)}
            </button>`).join('')}
          </div>

          <!-- Interactive Step Editor -->
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center">
              <h3 class="font-extrabold text-sm text-slate-900">💭 Step ${curStep+1} Prompt: ${esc(st.prompt)}</h3>
              <button data-s="${esc(curSent)}" onclick="speakText(this.dataset.s,this,'student')" class="px-2.5 py-1 bg-white border border-slate-200 hover:bg-slate-100 rounded-lg text-xs font-bold">🔊 Listen Step</button>
            </div>

            ${supportLvl <= 2 ? `<div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs font-extrabold text-amber-950 flex items-center justify-between">
              <span>🗣️ Sentence Frame: "${esc(st.frame)} ..."</span>
              <span class="text-[10px] text-amber-700 uppercase font-black">Recycles 'so that'</span>
            </div>` : ''}

            ${supportLvl === 1 ? `<div class="space-y-1.5">
              <span class="text-[11px] font-bold text-slate-500">Pick an Idea Chunk:</span>
              <div class="flex flex-wrap gap-2">
                ${st.ideas.map(id => `<button data-v="${esc(id)}" onclick="builderState[curTopic][curStep].idea=this.dataset.v; builderState[curTopic][curStep].custom=''; renderPart2()" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${slot.idea===id && !slot.custom?'bg-teal-600 text-white border-teal-600 shadow-xs':'bg-white border-slate-200 text-slate-700 hover:border-teal-300'}">${esc(id)}</button>`).join('')}
              </div>
              <div class="pt-1">
                <span class="text-[11px] font-bold text-slate-500">Add Context Detail (Optional):</span>
                <div class="flex flex-wrap gap-1.5 pt-1">
                  ${st.details.map(dt => `<button data-d="${esc(dt)}" onclick="builderState[curTopic][curStep].detail=(builderState[curTopic][curStep].detail==='${esc(dt)}'?'':'${esc(dt)}'); renderPart2()" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold border ${slot.detail===dt?'bg-teal-100 border-teal-400 text-teal-900':'bg-white border-slate-200 text-slate-600'}">+ ${esc(dt)}</button>`).join('')}
                </div>
              </div>
            </div>` : ''}

            <div>
              <span class="text-[11px] font-bold text-slate-500 block mb-1">Personal Customization:</span>
              <input type="text" value="${esc(slot.custom)}" oninput="builderState[curTopic][curStep].custom=this.value" placeholder="✍️ Or type your own personal sentence here..." class="w-full px-3.5 py-2 rounded-xl bg-white border border-slate-200 focus:border-teal-500 focus:outline-none text-xs sm:text-sm">
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-slate-200/80">
              <button onclick="curStep=Math.max(0,curStep-1); renderPart2()" class="px-3.5 py-1.5 bg-white border border-slate-200 hover:bg-slate-100 rounded-xl text-xs font-bold">⬅ Prev Step</button>
              <div class="text-xs font-extrabold text-teal-800 bg-teal-50 px-3 py-1 rounded-lg border border-teal-200">
                ✅ Preview: "${esc(curSent)}"
              </div>
              <button onclick="curStep=Math.min(3,curStep+1); renderPart2()" class="px-4 py-1.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-extrabold transition">Next Step ➔</button>
            </div>
          </div>

          <!-- Spoken Output & Scaffolding Fading Box -->
          <div class="bg-slate-900 text-white p-5 rounded-2xl space-y-3 shadow-md">
            <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-800 pb-2.5">
              <span class="text-xs font-black uppercase text-teal-400 tracking-wider">🎙️ Your Complete 4-Sentence Spoken Story</span>
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] text-slate-400 font-bold uppercase mr-1">Fading Scaffolding:</span>
                <button onclick="fadeLvl=0; renderPart2()" class="px-2.5 py-1 rounded-lg text-xs font-bold transition ${fadeLvl===0?'bg-teal-400 text-slate-950':'bg-slate-800 text-slate-300'}">Full Text</button>
                <button onclick="fadeLvl=1; renderPart2()" class="px-2.5 py-1 rounded-lg text-xs font-bold transition ${fadeLvl===1?'bg-teal-400 text-slate-950':'bg-slate-800 text-slate-300'}">Keywords Only</button>
                <button onclick="fadeLvl=2; renderPart2()" class="px-2.5 py-1 rounded-lg text-xs font-bold transition ${fadeLvl===2?'bg-teal-400 text-slate-950':'bg-slate-800 text-slate-300'}">First 2 Words</button>
                <button onclick="speakText(LESSON_DATA.fluency.topicCards[curTopic].steps.map((s,i)=>buildSent(s,builderState[curTopic][i])).join(' '),this,'student')" class="px-3 py-1 rounded-lg bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-black transition">🔊 Read Story</button>
              </div>
            </div>

            <div class="space-y-2">
              ${card.steps.map((s, i) => {
                const full = buildSent(s, stArr[i]);
                const disp = fadeLvl === 1 
                  ? `🔑 Cue: "${stArr[i].idea || s.ideas[0]}"` 
                  : (fadeLvl === 2 ? `${full.split(' ').slice(0,2).join(' ')} ...` : full);
                return `<div class="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700/60 text-xs sm:text-sm flex justify-between items-center hover:bg-slate-800 transition">
                  <span class="leading-relaxed"><strong class="text-teal-400 mr-1.5">${i+1}.</strong> ${esc(disp)}</span>
                  <div class="flex gap-1 shrink-0 ml-2">
                    <button data-s="${esc(full)}" onclick="speakText(this.dataset.s,this,'student')" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-[11px] font-bold">🔊</button>
                    <button data-s="${esc(full)}" onclick="translateTextDirect(this.dataset.s)" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-[11px] font-bold">🌍</button>
                  </div>
                </div>`;
              }).join('')}
            </div>

            <div class="p-3 bg-indigo-950/80 border border-indigo-500/30 rounded-xl text-xs font-bold text-amber-300 flex justify-between items-center">
              <span>🦅 Solo Twist Question: ${esc(card.freeTwist)}</span>
              <button onclick="speakText('${esc(card.freeTwist)}',this,'teacher')" class="px-2 py-0.5 bg-white/10 hover:bg-white/20 rounded text-[11px] font-bold text-white shrink-0">🔊 Twist</button>
            </div>
          </div>
        </section>`;
    }

    window.onload = initPart2;
  </script>
</body>
</html>
